[project]
name = "supermimic-prerequisites"
version = "0.0.0"
description = "Preparatory environment only; official SuperMimic training code is not available."
requires-python = ">=3.11,<3.12"
dependencies = ["pip==26.2.2",
    "nvidia-cublas-cu12==12.8.3.14; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "nvidia-cudnn-cu12==9.7.1.26; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "torch==2.7.1",
  "mujoco-warp",
  "numpy==1.26.4",
  "scipy",
  "imageio[ffmpeg]",
  "tensorboard",
  "wandb",
  "tqdm",
  "pyyaml",
]
[tool.uv.sources]
nvidia-cublas-cu12 = { index = "pytorch-cu128" }
nvidia-cudnn-cu12 = { index = "pytorch-cu128" }
torch = { index = "pytorch-cu128" }
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "aliyun-pypi"
url = "https://mirrors.aliyun.com/pypi/simple"
default = true

[tool.uv]
link-mode = "clone"
